name: Deploy UCM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GITHUB_TOKEN cannot initialize Pages; an admin must enable it once in Settings.
      - name: Check GitHub Pages configuration
        id: pages-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "${status}" != "200" ]; then
            echo "::error::GitHub Pages is not enabled or is unavailable for this repository (API HTTP ${status}). Open Settings → Pages and choose GitHub Actions. Private repositories require a plan that supports private Pages."
            exit 1
          fi
          echo "configured=true" >> "${GITHUB_OUTPUT}"

      - name: Configure Pages
        if: steps.pages-check.outputs.configured == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: steps.pages-check.outputs.configured == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        if: steps.pages-check.outputs.configured == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
